name: Deploy to Cloud Run

on:
    push:
        branches:
            - main

env:
    REGION: ${{ secrets.GCP_REGION }}
    PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
    deploy-remix:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up gcloud
              uses: google-github-actions/setup-gcloud@v2
              with:
                  service_account_key: ${{ secrets.GCP_SERVICE_KEY }}
                  project_id: ${{ secrets.GCP_PROJECT_ID }}

            - name: Configure Docker
              run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

            - name: Build Remix image
              run: |
                  docker build -t $IMAGE_TAG -f apps/web/Dockerfile .

            - name: Push Remix image
              run: |
                  docker push $REGION-docker.pkg.dev/$PROJECT_ID/musicall/remix:latest

            - name: Deploy Remix
              uses: google-github-actions/deploy-cloudrun@v2
              with:
                  service: remix-web
                  image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/musicall/remix:latest
                  region: ${{ env.REGION }}

    deploy-socket:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up gcloud
              uses: google-github-actions/setup-gcloud@v2
              with:
                  service_account_key: ${{ secrets.GCP_SERVICE_KEY }}
                  project_id: ${{ secrets.GCP_PROJECT_ID }}

            - name: Configure Docker
              run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

            - name: Build Socket image
              run: |
                  docker build -t $IMAGE_TAG -f apps/server/Dockerfile .

            - name: Push Socket image
              run: |
                  docker push $REGION-docker.pkg.dev/$PROJECT_ID/musicall/socket:latest

            - name: Deploy Socket
              uses: google-github-actions/deploy-cloudrun@v2
              with:
                  service: socket-server
                  image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/musicall/socket:latest
                  region: ${{ env.REGION }}
